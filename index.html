<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Separador de Envios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* ===== WeAxis · tokens ===== */
:root{
  --lime:#ECFC30; --lime-tint:rgba(236,252,48,.35);
  --ground:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F5F5; --line:#DBDBDB;
  --ink:#212121; --ink-2:#666666; --ink-3:#8A8A8A;
  --accent:#212121; --accent-soft:#F0F0F0;
  --chip-bg:var(--lime-tint); --chip-ink:#212121;
  --good:#1E7F4F; --good-soft:#E8F3EC;
  --warn:#A15C00; --warn-soft:#FBF1E3;
  --crit:#B3261E; --crit-soft:#FAE9E8;
  --bar:#212121; --bar-sel:#ECFC30;
  --canal:#ECFC30;                       /* cor do canal ativo, trocada em runtime */
  --radius:14px; --pill:999px;
  --ease:cubic-bezier(.22,1,.36,1); --dur:420ms; --rapido:200ms;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#141414; --surface:#1E1E1E; --surface-2:#191919; --line:#323232;
  --ink:#FFFFFF; --ink-2:#C6C6C6; --ink-3:#9A9A9A;
  --accent:#ECFC30; --accent-soft:#262617;
  --chip-bg:rgba(236,252,48,.16); --chip-ink:#ECFC30;
  --good:#5FC79E; --good-soft:#16231C; --warn:#DDB05C; --warn-soft:#241E12;
  --crit:#E88C81; --crit-soft:#2A1614; --bar:#E3E3E3;
}}
:root[data-theme="dark"]{
  --ground:#141414; --surface:#1E1E1E; --surface-2:#191919; --line:#323232;
  --ink:#FFFFFF; --ink-2:#C6C6C6; --ink-3:#9A9A9A;
  --accent:#ECFC30; --accent-soft:#262617;
  --chip-bg:rgba(236,252,48,.16); --chip-ink:#ECFC30;
  --good:#5FC79E; --good-soft:#16231C; --warn:#DDB05C; --warn-soft:#241E12;
  --crit:#E88C81; --crit-soft:#2A1614; --bar:#E3E3E3;
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Inter",-apple-system,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:"Inter Tight","Inter",Helvetica,Arial,sans-serif;
  letter-spacing:-.025em;line-height:1.1;font-weight:500;text-wrap:balance;margin:0}
a{color:inherit}

/* ===== faixa ink ===== */
.band{background:#181818;color:#fff;position:relative;overflow:hidden;
  border-bottom:4px solid var(--canal);transition:border-color var(--dur) var(--ease)}
.band .inner{max-width:1180px;margin:0 auto;padding:24px 24px 0;position:relative;z-index:2}
.band-mark{position:absolute;right:-70px;top:-40px;height:330px;opacity:.09;pointer-events:none;
  transition:transform 1.2s var(--ease), opacity var(--dur) var(--ease);z-index:0}
.band.trocando .band-mark{transform:rotate(-14deg) scale(1.06)}
.topo{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;justify-content:space-between}
.lockup{height:24px;display:block;margin-bottom:18px}
.band h1{font-size:clamp(1.9rem,3.4vw,2.7rem);color:#fff;transition:opacity var(--rapido) var(--ease)}
.band p{margin:10px 0 0;color:#BDBDBD;max-width:60ch;font-size:14.5px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.band .eyebrow{color:#BDBDBD}

.stats{display:flex;gap:28px;text-align:right}
.stats .s{min-width:70px}
.stats .sv{font-family:"Inter Tight",sans-serif;font-size:27px;font-weight:500;letter-spacing:-.03em;
  line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.stats .s:first-child .sv{color:var(--canal)}
.stats .sk{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#BDBDBD;margin-top:6px}

/* ===== abas de canal ===== */
.abas{display:flex;gap:4px;margin-top:26px;position:relative}
.aba{appearance:none;background:transparent;border:0;cursor:pointer;color:#9A9A9A;
  font:inherit;font-weight:500;font-size:15px;padding:12px 22px 14px;position:relative;
  display:flex;align-items:center;gap:9px;transition:color var(--rapido) var(--ease)}
.aba:hover{color:#fff}
.aba[aria-selected="true"]{color:#fff}
.aba .ponto{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.45;
  transition:opacity var(--rapido) var(--ease), transform var(--dur) var(--ease)}
.aba[aria-selected="true"] .ponto{opacity:1;transform:scale(1.35)}
.aba .cont{font-family:"IBM Plex Mono",monospace;font-size:11px;opacity:.6}
.aba:focus-visible{outline:2px solid var(--canal);outline-offset:-4px;border-radius:8px}
#indicador{position:absolute;bottom:0;height:3px;background:var(--canal);border-radius:3px 3px 0 0;
  transition:transform var(--dur) var(--ease), width var(--dur) var(--ease), background var(--dur) var(--ease)}

/* ===== corpo ===== */
.wrap{max-width:1180px;margin:0 auto;padding:26px 24px 80px;display:flex;flex-direction:column;gap:22px}
.wrap.saindo{opacity:0;transform:translateY(10px)}
.wrap{transition:opacity var(--rapido) var(--ease), transform var(--rapido) var(--ease)}

.card{background:var(--surface-2);border:1px solid transparent;border-radius:var(--radius);
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.card:hover{background:var(--surface);border-color:var(--line)}
.card>.head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 22px 14px}
.card>.head h2{font-size:19px}
.card>.body{padding:0 22px 22px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media (max-width:900px){.dupla{grid-template-columns:1fr}}

.btn{font:inherit;font-weight:500;cursor:pointer;border-radius:var(--pill);border:1px solid var(--line);
  background:transparent;color:var(--ink);padding:11px 22px;
  transition:background var(--rapido) var(--ease),color var(--rapido) var(--ease),
             border-color var(--rapido) var(--ease),transform var(--rapido) var(--ease)}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn.primary{background:#212121;border-color:#212121;color:#fff}
.btn.primary:hover{background:var(--canal);border-color:var(--canal);color:#212121}
.btn.sm{padding:7px 15px;font-size:13.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}

textarea,input,select{font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;width:100%}
textarea{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;min-height:120px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-2)}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.row>*{flex:1 1 160px}
.row .shrink{flex:0 0 auto}
.drop{border:1.5px dashed var(--line);border-radius:var(--radius);padding:14px;
  transition:border-color var(--rapido) var(--ease),background var(--rapido) var(--ease)}
.drop.over{border-color:var(--ink);background:var(--chip-bg)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:1px;
  background:var(--line);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.kpi{background:var(--surface);padding:18px}
.kpi .v{font-family:"Inter Tight",sans-serif;font-size:30px;font-weight:500;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;line-height:1.05;display:inline-block}
.kpi.hero .v{box-shadow:inset 0 -.32em 0 var(--canal);padding:0 .08em}
.kpi .k{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin-top:9px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background var(--rapido) var(--ease)}
tbody tr:hover td{background:var(--accent-soft)}
.num{text-align:right;font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono",monospace}
.mono{font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.scroll{overflow-x:auto}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:3px 11px;
  border-radius:var(--pill);border:1px solid transparent;white-space:nowrap}
.pill.n{background:transparent;color:var(--ink-2);border-color:var(--line)}
.pill.a{background:var(--chip-bg);color:var(--chip-ink)}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.pill.c{background:var(--crit-soft);color:var(--crit)}
.pill.g{background:var(--good-soft);color:var(--good)}

/* ===== cartões de envio ===== */
.envios-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.env{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:18px;
  display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;
  animation:sobe var(--dur) var(--ease) both;
  transition:transform var(--rapido) var(--ease), box-shadow var(--rapido) var(--ease)}
.env:hover{transform:translateY(-3px);box-shadow:0 10px 30px -18px rgba(0,0,0,.45)}
.env::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.env.pronto::before{background:var(--canal)}
.env.alerta::before{background:var(--crit)}
@keyframes sobe{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.env .topo2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.env .data{font-family:"Inter Tight",sans-serif;font-size:26px;font-weight:500;letter-spacing:-.03em;
  line-height:1;font-variant-numeric:tabular-nums}
.env .dest{font-size:14px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.env .num{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);text-align:left}
.env .metricas{display:flex;gap:1px;background:var(--line);border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.env .metricas div{flex:1;background:var(--surface-2);padding:9px 10px}
.env .metricas b{display:block;font-family:"Inter Tight",sans-serif;font-size:17px;font-weight:500;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.env .metricas span{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.env .acoes{display:flex;gap:8px;flex-wrap:wrap}
.env .acoes .btn{flex:1 1 auto}

.lotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.lote{border:1px solid var(--line);border-radius:var(--radius);padding:18px;background:var(--surface);
  display:flex;flex-direction:column;gap:12px;animation:sobe var(--dur) var(--ease) both}
.lote .n{font-family:"Inter Tight",sans-serif;font-weight:500;font-size:17px;letter-spacing:-.02em}
.lote .m{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.lote .fn{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);word-break:break-all}
.barra{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.barra i{display:block;height:100%;background:var(--canal);width:0;transition:width 900ms var(--ease)}

.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:var(--pill);
  padding:8px 15px;font-size:13.5px;display:inline-flex;gap:9px;align-items:center;
  transition:background var(--rapido) var(--ease),border-color var(--rapido) var(--ease)}
.chip:hover{border-color:var(--ink)}
.chip[aria-selected="true"]{background:var(--canal);border-color:var(--canal);color:#212121}
.chip[aria-selected="true"] .pill.n{border-color:rgba(33,33,33,.32);color:#212121}

.cronoline{display:flex;flex-direction:column}
.crow{display:grid;grid-template-columns:70px 1fr auto;gap:16px;align-items:center;
  padding:13px 6px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .d{font-family:"Inter Tight",sans-serif;font-weight:500;font-size:17px;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.crow .d small{display:block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:400;
  color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em}
.crow.hoje{background:var(--chip-bg);border-radius:10px;padding-left:12px;padding-right:12px}
.crow .sub{font-size:13px;color:var(--ink-2)}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .btn[aria-pressed="true"]{background:#212121;border-color:#212121;color:#fff}
.rel-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:20px}
@media (max-width:900px){.rel-cols{grid-template-columns:1fr}}

.empty{color:var(--ink-3);font-size:13.5px;padding:8px 2px}
.msg{font-size:13.5px;padding:11px 14px;border-radius:10px;margin-top:12px;animation:sobe var(--rapido) var(--ease) both}
.msg.ok{background:var(--good-soft);color:var(--good)}
.msg.err{background:var(--crit-soft);color:var(--crit)}
.foot{color:var(--ink-3);font-size:12px;text-align:center}
svg .grid{stroke:var(--line)}
svg .bar{fill:var(--bar);transition:fill var(--rapido) var(--ease)}
svg .bar:hover{fill:var(--canal)}
svg .bar.sel{fill:var(--canal)}
.tip{position:fixed;pointer-events:none;background:#212121;color:#fff;font-size:12.5px;padding:7px 11px;
  border-radius:8px;opacity:0;transition:opacity .12s;z-index:50;white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms !important;transition-duration:1ms !important}
}
@media (max-width:600px){
  .band .inner{padding:20px 16px 0} .wrap{padding:20px 16px 64px}
  .card>.head{padding:16px 16px 12px} .card>.body{padding:0 16px 18px}
  .aba{padding:11px 14px 13px;font-size:14px} .stats{gap:18px}
}
</style>
</head>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ==================================================================
   CANAIS — cada um lê a sua planilha e tem as suas regras.
   Para ligar a Shopee: preencha SHEET_ID com o id da planilha nova
   (compartilhada como "qualquer pessoa com o link — leitor").
   ================================================================== */
const CANAIS = {
  full: {
    nome: "Full · Mercado Livre",
    eyebrow: "Operação WMS · Full Mercado Livre",
    sub: "Lê as abas de envio da planilha do full, divide em lotes quando um SKU tem mais de um código ML e deixa os arquivos ISO-8859-1 prontos para o WMS.",
    cor: "#ECFC30",
    SHEET_ID: "1oTrpuueox03WivYXC02J_V7AqEOZpRpLvc12snnzV9c",
    ABA_CRONOGRAMA: "CRONOGRAMA",
    DESTINOS: ["ITAJAI", "LONDRINA"],
    sufixos: [" .ENVIO", " ENVIO"],
    formato: "bloco",                    // "Código ML: … SKU: …" numa célula
    regraSKU: true,                      // um SKU não pode repetir no mesmo arquivo
    colunas: ["codigoProduto", "quantidade", "IDFULL"],
    prefixoArq: "SEPARACAO_FULL"
  },
  shopee: {
    nome: "Shopee",
    eyebrow: "Operação WMS · Shopee",
    sub: "Lê as abas de envio da planilha da Shopee e divide a separação em arquivos de até 500 unidades, para várias pessoas separarem ao mesmo tempo.",
    cor: "#EE4D2D",
    SHEET_ID: "12da36oF7Ylbz7sbFo5-jJjKlx_MH8MCj0c-Ahn12rJk",   // planilha modelo da Shopee
    ABA_CRONOGRAMA: "CRONOGRAMA",
    DESTINOS: ["SHOPEE"],                // abas do modelo: "28/09 SHOPEE"
    sufixos: ["", " .ENVIO", " ENVIO"],
    formato: "tabela",                   // colunas SKU | PRODUTO | UNIDADES | …
    regraSKU: false,                     // sem código de anúncio, sem essa restrição
    colunas: ["codigoProduto", "quantidade"],
    prefixoArq: "SEPARACAO_SHOPEE"
  }
};
/* comuns aos dois canais */
const COMUM = {
  MAX_UNIDADES_LOTE: 500,
  JANELA: {antes: 10, depois: 110},
  JANELA_FUNDA: {antes: 90, depois: 240},
  PARALELO: 10,
  TTL_MISS: 30 * 60 * 1000,
  padraoNome: /^\s*(\d{1,2})\s*\/\s*(\d{1,2})(?:\s*\/\s*(\d{2,4}))?\s*(.*)$/,
  fimEnvio: /[\s.]*ENVIO[\s.]*$/i
};
let canal = "full";
/* cfgDe/estDe recebem o canal explicitamente. Toda operação assíncrona carrega
   o seu canal junto: sem isso, trocar de aba no meio de uma varredura faria a
   resposta em voo ser interpretada com as regras — e gravada no estado — do
   canal errado. */
const cfgDe = c => Object.assign({}, COMUM, CANAIS[c]);
const C = () => cfgDe(canal);

/* estado separado por canal */
const ESTADOS = {full: novoEstado(), shopee: novoEstado()};
function novoEstado(){ return {envios: [], crono: [], sel: null, fallbackAssin: null, fallbackEhEnvio: false, varrido: false}; }
const S = () => ESTADOS[canal];
const estDe = c => ESTADOS[c];

/* ---------- persistência ---------- */
const chaveEstado = c => "domus-sep-" + c + "-v1";
const chaveMiss   = c => "domus-sep-miss-" + c + "-v1";
function carregar(){
  for(const c of Object.keys(ESTADOS)){
    try{
      const r = localStorage.getItem(chaveEstado(c));
      if(r){ const j = JSON.parse(r); ESTADOS[c].envios = j.envios || []; ESTADOS[c].crono = j.crono || []; ESTADOS[c].sel = j.sel || null; }
    }catch(e){}
  }
}
function salvarEstado(c, est){
  try{ localStorage.setItem(chaveEstado(c),
    JSON.stringify({envios: est.envios, crono: est.crono, sel: est.sel})); }catch(e){}
}
function salvar(){ salvarEstado(canal, S()); }
const lerMiss = c => { try{ return JSON.parse(localStorage.getItem(chaveMiss(c || canal))) || {}; }catch(e){ return {}; } };
const gravarMiss = (m, c) => { try{ localStorage.setItem(chaveMiss(c || canal), JSON.stringify(m)); }catch(e){} };

/* ---------- tabela: csv / tsv / ; com campos entre aspas ---------- */
function sniff(t){
  let fora = true, c = {",":0, ";":0, "\t":0};
  for(let i=0;i<t.length;i++){
    const ch = t[i];
    if(ch === '"'){ fora = !fora; continue; }
    if(fora && ch in c) c[ch]++;
  }
  return Object.keys(c).sort((a,b) => c[b]-c[a])[0] || ",";
}
function parseTable(text){
  const d = sniff(text), rows = []; let row = [], cell = "", q = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if(ch === '"') q = true;
    else if(ch === d){ row.push(cell); cell = ""; }
    else if(ch === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
    else if(ch !== "\r") cell += ch;
  }
  row.push(cell); rows.push(row);
  return rows.filter(r => r.some(c => c.trim() !== ""));
}

/* ---------- datas ---------- */
function dObj(s){
  const m = String(s).match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
  if(!m) return null;
  let a = m[3] ? parseInt(m[3],10) : new Date().getFullYear();
  if(a < 100) a += 2000;
  return new Date(a, parseInt(m[2],10)-1, parseInt(m[1],10));
}
function completarAno(str){
  const m = String(str).match(/^\s*(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
  if(!m) return null;
  if(m[3]) return m[1] + "/" + m[2] + "/" + (m[3].length === 2 ? "20" + m[3] : m[3]);
  const hj = new Date(), b = hj.getFullYear();
  const esc = [b-1, b, b+1].map(a => new Date(a, +m[2]-1, +m[1]))
                           .sort((x,y) => Math.abs(x-hj) - Math.abs(y-hj))[0];
  return m[1] + "/" + m[2] + "/" + esc.getFullYear();
}
const pad2 = n => String(n).padStart(2,"0");
function fmt(s){ const d = dObj(s); return d ? pad2(d.getDate()) + "/" + pad2(d.getMonth()+1) : String(s); }
function diaSem(s){ const d = dObj(s); return d ? ["dom","seg","ter","qua","qui","sex","sáb"][d.getDay()] : ""; }
function hoje0(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function emissao(data){
  const d = dObj(data); if(!d) return "—";
  const e = new Date(d.getTime() - 86400000);
  return pad2(e.getDate()) + "/" + pad2(e.getMonth()+1);
}

/* ---------- nomes de aba ---------- */
const ACENTOS = {ITAJAI:"Itajaí", "ITAJAI-SC":"Itajaí", LONDRINA:"Londrina", SHOPEE:"Shopee"};
function bonito(s){
  if(!s) return canal === "shopee" ? "Shopee" : "Envio";
  const k = s.toUpperCase().replace(/\s+/g," ").trim();
  if(ACENTOS[k]) return ACENTOS[k];
  return k.toLowerCase().replace(/(^|[\s\-])([a-zà-ú])/g, (x,a,b) => a + b.toUpperCase());
}
function lerNomeAba(t){
  const m = String(t).match(COMUM.padraoNome);
  if(!m) return null;
  const data = completarAno(pad2(m[1]) + "/" + pad2(m[2]) + (m[3] ? "/" + m[3] : ""));
  if(!data) return null;
  const dest = (m[4] || "").replace(COMUM.fimEnvio, "").replace(/[.\s]+$/,"").trim();
  return {data, destino: bonito(dest)};
}
function variantes(dd, mm, dest){
  const D = dest.toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  return C().sufixos.map(suf => dd + "/" + mm + " " + D + suf);
}

/* ==================================================================
   Leitura da planilha pública.
   Armadilha do gviz: pedir uma aba inexistente NÃO dá erro — devolve a
   PRIMEIRA aba. Com o CRONOGRAMA na primeira posição isso é fácil de
   reconhecer; a assinatura da resposta de calibração é a segunda defesa.
   ================================================================== */
const reML = /C[oó]digo\s*ML\s*:\s*([A-Za-z0-9]+)/i;
function urlAba(nome, cfg){
  return "https://docs.google.com/spreadsheets/d/" + cfg.SHEET_ID +
         "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(nome);
}
/* uma leitura pendurada travaria um dos trabalhadores da varredura para sempre */
const TIMEOUT_MS = 20000;
async function textoAba(nome, cfg){
  cfg = cfg || C();
  if(!cfg.SHEET_ID) throw new Error("planilha deste canal ainda não configurada");
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), TIMEOUT_MS);
  let r;
  try{ r = await fetch(urlAba(nome, cfg), {cache:"no-store", signal: ctl.signal}); }
  catch(e){ throw new Error(e.name === "AbortError" ? "tempo esgotado" : "falha de rede"); }
  finally{ clearTimeout(t); }
  if(!r.ok) throw new Error("HTTP " + r.status);
  const txt = new TextDecoder("utf-8").decode(await r.arrayBuffer());
  if(/^\s*</.test(txt)) throw new Error("planilha sem acesso público");
  return txt;
}
function assinatura(texto){
  const rows = parseTable(texto);
  const cab = ((rows[0] || [])[0] || "").trim().slice(0,40);
  const mls = [];
  for(const r of rows){
    const c = r.find(x => reML.test(x));
    if(c){ mls.push((c.match(reML)||[])[1]); if(mls.length === 5) break; }
  }
  const linhas = rows.length;
  return cab + "|" + mls.join(",") + "|" + linhas;
}
async function calibrar(cfg, est){
  cfg = cfg || C(); est = est || S();
  if(est.fallbackAssin !== null) return;
  const txt = await textoAba("__ABA_INEXISTENTE_" + Date.now() + "__", cfg);
  est.fallbackAssin = assinatura(txt);
  est.fallbackEhEnvio = ehEnvio(parseTable(txt), cfg);
}
async function baixarAba(nome, cfg, est){
  cfg = cfg || C(); est = est || S();
  await calibrar(cfg, est);
  const txt = await textoAba(nome, cfg);
  if(assinatura(txt) === est.fallbackAssin) throw new Error("aba inexistente");
  return txt;
}

/* ==================================================================
   Leitura do conteúdo — dois formatos de aba
   ================================================================== */
const reSKUlinha = /\bSKU\b/i;
function ehCrono(rows){
  const t = rows.slice(0,3).flat().join(" ").toUpperCase();
  return t.includes("CRONOGRAMA") || (t.includes("DATA ENVIO") && t.includes("MODO"));
}
function ehEnvio(rows, cfg){
  cfg = cfg || C();
  if(cfg.formato === "bloco") return rows.some(r => r.some(c => reML.test(c)));
  return achaCabecalho(rows) !== -1;
}
/* Aba em tabela: o cabeçalho é a linha que tem uma célula "SKU".
   Não dá para exigir o rótulo "UNIDADES": o gviz do Google infere o tipo de
   cada coluna e APAGA o texto do cabeçalho de uma coluna numérica — na
   planilha real o "UNIDADES" chega vazio. Por isso a coluna de quantidade é
   descoberta pelo conteúdo, não pelo nome. */
function achaCabecalho(rows){
  for(let i=0;i<Math.min(rows.length, 15);i++){
    if(rows[i].some(c => String(c).trim().toUpperCase() === "SKU")) return i;
  }
  return -1;
}
/* Converte só o que É um número. Regra estrita de propósito:
   "1.200" → 1200 · "30,0" → 30 · "30 un" → 30
   "LAV-VOND-1300-220" → null · "Mop Giratório 360°" → null
   A versão anterior apenas removia os não-dígitos, então um SKU virava
   1300220 e um nome de produto com "360°" competia como coluna de
   quantidade — quantidade errada indo para o WMS sem nenhum aviso. */
function numero(v){
  let t = String(v == null ? "" : v).trim();
  if(!t) return null;
  t = t.replace(/\s*(un|unid|unidade|unidades|pç|pcs|pc)\.?$/i, "").trim();
  if(!/^\d{1,3}(?:\.\d{3})+(?:,\d+)?$|^\d+(?:,\d+)?$/.test(t)) return null;
  const inteira = t.split(",")[0].replace(/\./g, "");
  return /^\d+$/.test(inteira) ? parseInt(inteira, 10) : null;
}
const inteiro = v => numero(v) !== null;

/* Qual coluna carrega a quantidade que vai para o WMS.
   A planilha da Shopee tem VÁRIAS colunas com "quantidade" no nome
   (Quantidade Sugerida, Quantidade wms, Qtd. Unidade CX), então a escolha é
   por lista de prioridade, não por "contém quantidade". A lista negra evita
   que unidades por caixa, caixas a separar ou peso sejam confundidos com a
   quantidade a separar. */
const PRIORIDADE_QTD = [
  /^QUANTIDADE\s*SUGERIDA$/, /^UNIDADES?$/, /^TOTAL\s*DE\s*SKUS?$/,
  /^QUANTIDADE$/, /^QTDE?$/
];
const VETADAS_QTD = /WMS|CX|CAIXA|MASTER|M[ÁA]STER|PESO|MEDIDA|VOLUME|ETIQUETA/;
function colunaQtd(rows, h, cSku, up){
  for(const re of PRIORIDADE_QTD){
    const i = up.findIndex(c => re.test(c) && !VETADAS_QTD.test(c));
    if(i !== -1 && i !== cSku) return i;
  }
  const solto = up.findIndex(c => /UNIDADE|QUANTIDADE|QTD/.test(c) && !VETADAS_QTD.test(c));
  if(solto !== -1 && solto !== cSku) return solto;
  /* cabeçalho apagado pelo gviz: cai para o conteúdo, ainda respeitando a
     lista negra e preferindo a coluna logo à direita do SKU */
  const largura = Math.max(...rows.slice(h, h+40).map(r => r.length));
  let melhor = -1, melhorN = 0;
  for(let c = 0; c < largura; c++){
    if(c === cSku) continue;
    if(VETADAS_QTD.test(up[c] || "")) continue;
    let n = 0;
    for(let i = h+1; i < rows.length; i++){
      const primeiro = String(rows[i][0] || "");
      if(/TOTAL DE PRODUTOS/i.test(primeiro)) continue;     // a linha de total não conta
      if(inteiro(rows[i][c])) n++;
    }
    if(n > melhorN || (n === melhorN && c === cSku + 1)){ melhorN = n; melhor = c; }
  }
  return melhorN ? melhor : -1;
}
function extrairSKU(bloco){
  const primeira = bloco.split(/\r?\n/)[0];
  let bruto = null, m;
  if((m = primeira.match(/\bSKU\s*:\s*(.+)$/i))) bruto = m[1];
  else if((m = primeira.match(/\bSKU([^:\n]*):\s*(.*)$/i))) bruto = m[1] + " " + m[2];
  else if((m = primeira.match(/\bSKU\s+(.+)$/i))) bruto = m[1];
  else { m = bloco.match(/\bSKU\s*:?\s*([^\s]+)/i); return m ? m[1] : ""; }
  const limpo = String(bruto).replace(/\s*-\s*/g, "-").trim();
  return (limpo.split(/\s+/)[0] || "").replace(/-{2,}/g,"-").replace(/^-+|-+$/g,"");
}

function parseEnvio(rows, cfg){
  cfg = cfg || C();
  return cfg.formato === "bloco" ? parseBloco(rows) : parseTabela(rows);
}

/* formato do full: bloco "Código ML: … Código universal: … SKU: …" */
function parseBloco(rows){
  const itens = [], naoLidas = [];
  let totalDecl = null;
  const bruto = rows.flat().join("\n");
  const md = bruto.match(/DATA D[EO] (?:ENVIO|ENTREGA)\s*:\s*(\d{1,2}\/\d{1,2}(?:\/\d{2,4})?)/i);
  const mn = bruto.match(/N[ºo°]?\s*do\s*Envio\s*[:#]?\s*#?\s*(\d{4,})/i);
  for(const r of rows){
    const i = r.findIndex(c => reML.test(c));
    if(i === -1){
      const j = r.findIndex(c => /TOTAL DE PRODUTOS/i.test(c));
      if(j !== -1){
        const n = r.slice(j+1).map(numero).find(n => n != null);
        if(n != null) totalDecl = n;
      }
      continue;
    }
    const bloco = r[i], linhas = bloco.split(/\r?\n/).map(s => s.trim());
    const ml = (bloco.match(reML)||[])[1] || "";
    const uni = (bloco.match(/universal\s*:\s*([^\s]+)/i)||[])[1] || "";
    const sku = extrairSKU(bloco);
    const torto = sku && !/\bSKU\s*:\s/i.test(linhas[0]);
    let desc = linhas[0].replace(/^.*?\bSKU[^:\n]*:\s*/i, "").replace(/^[^\s]+\s*/, "").trim();
    if(desc.length <= 3) desc = (linhas[1] || "").replace(/^SUPERMERCADO$/i,"").trim();
    let qtd = null;
    for(let k = i+1; k < r.length; k++){
      if(inteiro(r[k])){ qtd = numero(r[k]); break; }
    }
    const resto = r.slice(i+1).join(" | ");
    const flags = [];
    if(/SEM ESTOQUE/i.test(resto)) flags.push({t:"sem estoque", k:"c"});
    if(/RETIRAR|CANCELAD|N[ÃA]O ENVIAR/i.test(resto)) flags.push({t:"observação", k:"w"});
    if(/^N\/?A$/i.test(uni) || !uni) flags.push({t:"sem cód. universal", k:"w"});
    if(torto) flags.push({t:"rótulo SKU torto", k:"w"});
    if(sku && qtd != null) itens.push({sku, qtd, ml, uni, desc, flags});
    else naoLidas.push({ml, qtd, linha: linhas[0]});
  }
  return {itens, naoLidas, totalDecl, meta:{envioNum: mn ? mn[1] : null, dataDecl: md ? md[1] : null}};
}

/* formato da Shopee: colunas SKU | PRODUTO | UNIDADES | SITUAÇÃO | OBSERVAÇÕES */
function parseTabela(rows){
  const itens = [], naoLidas = [];
  let totalDecl = null;
  const bruto = rows.flat().join("\n");
  const md = bruto.match(/DATA DO ENVIO\s*:?\s*[,;\n]*\s*(\d{1,2}\/\d{1,2}(?:\/\d{2,4})?)/i);
  const mn = bruto.match(/N[ºo°]?\s*do\s*Envio\s*:?\s*[,;]?\s*#?\s*(\d{4,})/i);
  const h = achaCabecalho(rows);
  if(h === -1) return {itens, naoLidas, totalDecl, meta:{}};
  const up = rows[h].map(c => String(c).trim().toUpperCase());
  const cSku = up.indexOf("SKU");
  const cUn  = colunaQtd(rows, h, cSku, up);
  if(cUn === -1) return {itens, naoLidas, totalDecl, meta:{}};
  let cDes = up.findIndex(c => /PRODUTO|DESCRI/.test(c));
  if(cDes === -1 && cSku + 1 !== cUn) cDes = cSku + 1;
  const cCx   = up.findIndex(c => /^CX\s*MASTER$/.test(c));
  const cUnCx = up.findIndex(c => /UNIDADE\s*CX|QTD\.?\s*UNIDADE/.test(c));
  const cCxSep= up.findIndex(c => /TOTAL\s*CX/.test(c));
  const cMed  = up.findIndex(c => /MEDIDA/.test(c));
  /* na planilha da Shopee o acompanhamento vive na coluna "Quantidade wms" */
  const cSit = up.findIndex(c => /SITUA|STATUS|WMS/.test(c));
  const cObs = up.findIndex(c => /OBSERV/.test(c));
  for(let i = h+1; i < rows.length; i++){
    const r = rows[i];
    const primeiro = String(r[0] || "").trim();
    if(/TOTAL DE PRODUTOS/i.test(primeiro)){
      /* a linha de total tem vários números (unidades, caixas); o que vale é
         o da própria coluna de quantidade */
      const n = numero(r[cUn]);
      if(n != null) totalDecl = n;
      else { const q = r.slice(1).map(numero).find(x => x != null); if(q != null) totalDecl = q; }
      continue;
    }
    const sku = String(r[cSku] || "").trim();
    const bruto = String(r[cUn] == null ? "" : r[cUn]).trim();
    if(!sku && !bruto) continue;
    const qtd = numero(bruto);
    if(!sku || qtd == null){
      naoLidas.push({ml:"", qtd, linha: r.slice(0,4).join(" | ")});
      continue;
    }
    const sit = cSit !== -1 ? String(r[cSit] || "") : "";
    const obs = cObs !== -1 ? String(r[cObs] || "") : "";
    const flags = [];
    if(/SEM ESTOQUE/i.test(sit + " " + obs)) flags.push({t:"sem estoque", k:"c"});
    if(/RETIRAR|CANCELAD|N[ÃA]O ENVIAR/i.test(sit + " " + obs)) flags.push({t:"observação", k:"w"});
    if(/J[ÁA]\s*SEPARADO/i.test(sit)) flags.push({t:"já separado", k:"g"});
    /* caixa máster: quem separa precisa saber quantas caixas fechadas puxar */
    const ehCx = cCx !== -1 && /^S/i.test(String(r[cCx] || "").trim());
    const unCx = cUnCx !== -1 ? numero(r[cUnCx]) : null;
    const cxSep = cCxSep !== -1 ? numero(r[cCxSep]) : (ehCx && unCx ? Math.ceil(qtd/unCx) : null);
    if(ehCx && unCx > 1) flags.push({t: (cxSep != null ? cxSep + " cx" : "cx máster") + " · " + unCx + " un/cx", k:"a"});
    let desc = cDes !== -1 ? String(r[cDes] || "").trim() : "";
    if(!desc && cMed !== -1 && String(r[cMed] || "").trim()) desc = "caixa " + String(r[cMed]).trim();
    itens.push({sku, qtd, ml:"", uni:"", desc, flags, cx: ehCx ? {unCx, cxSep} : null});
  }
  return {itens, naoLidas, totalDecl, meta:{envioNum: mn ? mn[1] : null, dataDecl: md ? md[1] : null}};
}

function parseCrono(rows){
  const out = [];
  for(const r of rows){
    const cols = r.map(c => String(c).trim());
    const dest = cols[0];
    if(!dest || /CRONOGRAMA|DESTINO|CANAL/i.test(dest)) continue;
    if(!/\d{1,2}\/\d{1,2}/.test(cols[1] || "")) continue;
    const d = dObj(cols[1]);
    if(!d || d.getFullYear() < 1990) continue;
    out.push({destino: dest, data: cols[1], modo: cols[2]||"", alterar: cols[3]||"", motorista: cols[4]||""});
  }
  return out;
}

/* ==================================================================
   Lotes — teto de unidades, equilíbrio e (no full) uma linha por SKU
   ================================================================== */
function unLote(g){ return g.reduce((s,i) => s + i.qtd, 0); }
function lotes(itens, cfg){
  cfg = cfg || C();
  const cap = cfg.MAX_UNIDADES_LOTE || Infinity, regraSKU = cfg.regraSKU;
  const idx = itens.map((it,i) => ({it, i}));
  const grandes = idx.filter(x => x.it.qtd > cap);
  const normais = idx.filter(x => x.it.qtd <= cap);

  let piso = Math.ceil(normais.reduce((s,x)=>s+x.it.qtd,0) / cap) || 0;
  if(regraSKU){
    const rep = {};
    normais.forEach(x => rep[x.it.sku] = (rep[x.it.sku] || 0) + 1);
    piso = Math.max(piso, ...Object.values(rep), 0);
  }
  const caixas = Array.from({length: Math.max(piso, normais.length ? 1 : 0)},
                            () => ({itens: [], un: 0, skus: new Set()}));

  [...normais].sort((a,b) => b.it.qtd - a.it.qtd || a.i - b.i).forEach(x => {
    let alvo = null;
    for(const c of caixas){
      if(regraSKU && c.skus.has(x.it.sku)) continue;
      if(c.un + x.it.qtd > cap) continue;
      if(!alvo || c.un < alvo.un) alvo = c;          // sempre a caixa mais vazia
    }
    if(!alvo){ alvo = {itens: [], un: 0, skus: new Set()}; caixas.push(alvo); }
    alvo.itens.push(x); alvo.un += x.it.qtd; alvo.skus.add(x.it.sku);
  });

  const saida = caixas.filter(c => c.itens.length)
    .map(c => c.itens.sort((a,b) => a.i - b.i).map(x => x.it));
  grandes.forEach(x => saida.push([x.it]));
  return saida.sort((a,b) => unLote(b) - unLote(a));
}

function csvLote(g, cfg){
  const cols = (cfg || C()).colunas;
  let s = cols.join(";") + "\n";
  for(const it of g){
    const linha = cols.map(c => c === "quantidade" ? it.qtd : c === "IDFULL" ? it.ml : it.sku);
    s += linha.join(";") + "\n";
  }
  return s;
}
const MAPA_ACENTO = {"Ç":"C","ç":"c","ã":"a","Ã":"A","õ":"o","Õ":"O","–":"-","—":"-","’":"'"};
function latin1(str){
  const out = new Uint8Array(str.length);
  for(let i=0;i<str.length;i++){
    let c = str.charCodeAt(i);
    if(c > 255){ const r = MAPA_ACENTO[str[i]] || "?"; c = r.charCodeAt(0); }
    out[i] = c;
  }
  return out;
}
function slug(s){
  return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"").toUpperCase() || "ENVIO";
}
function nomeArq(env, i, n, cfg){
  cfg = cfg || C();
  const d = dObj(env.data);
  const dd = d ? pad2(d.getDate()) + pad2(d.getMonth()+1) : "";
  const num = env.meta && env.meta.envioNum ? "_" + env.meta.envioNum : "";
  return cfg.prefixoArq + "_" + dd + "_" + slug(env.destino) + num + (n > 1 ? "_parte" + (i+1) : "");
}
function baixar(base, texto, alvo, ext){
  /* CSV em ISO-8859-1 porque é o que o WMS aceita; o backup .json em UTF-8,
     senão acento vira lixo. */
  ext = ext || ".csv";
  const utf8 = ext === ".json";
  const dados = utf8 ? new TextEncoder().encode(texto) : latin1(texto);
  try{
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([dados], {type: utf8 ? "application/json" : "text/csv;charset=iso-8859-1"}));
    a.download = base + ext; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }catch(e){
    if(alvo) alvo.innerHTML = '<div class="msg err">O navegador bloqueou o download. Copie o conteúdo e salve como ' +
      esc(base + ext) + (utf8 ? '.' : ' em ISO-8859-1.') + '</div><textarea readonly style="margin-top:8px;min-height:150px">' + esc(texto) + '</textarea>';
  }
}

/* ---------- conferência ---------- */
function auditar(env, cfg){
  cfg = cfg || C();
  const un = env.itens.reduce((s,i)=>s+i.qtd,0), a = [];
  (env.naoLidas || []).forEach(n => a.push({k:"c",
    t: "Linha não lida — " + (n.qtd != null ? n.qtd + " un" : "sem quantidade") + " fora da separação",
    d: n.linha}));
  if(env.totalDecl != null && env.totalDecl !== un) a.push({k:"c",
    t: "Total divergente: planilha " + env.totalDecl + " × lista " + un +
       " (" + (env.totalDecl > un ? "+" : "") + (env.totalDecl - un) + ")",
    d: "O sistema vai reconhecer o total da planilha. Resolva antes de subir."});
  const porEan = {};
  env.itens.forEach(i => {
    if(!i.uni || /^N\/?A$/i.test(i.uni)) return;
    (porEan[i.uni] = porEan[i.uni] || {skus:new Set(), un:0});
    porEan[i.uni].skus.add(i.sku); porEan[i.uni].un += i.qtd;
  });
  Object.keys(porEan).forEach(e => {
    if(porEan[e].skus.size > 1) a.push({k:"w",
      t: "Código universal " + e + " em " + porEan[e].skus.size + " SKUs (" + porEan[e].un + " un)",
      d: [...porEan[e].skus].join(" · ") + " — se a extração agrupar por código universal, as unidades saem somadas."});
  });
  if(!cfg.regraSKU){
    const rep = {};
    env.itens.forEach(i => rep[i.sku] = (rep[i.sku] || 0) + 1);
    const dups = Object.keys(rep).filter(k => rep[k] > 1);
    if(dups.length) a.push({k:"w",
      t: dups.length + " SKU(s) repetido(s) na aba",
      d: dups.slice(0,8).join(" · ") + " — sem código de anúncio, linhas repetidas do mesmo SKU provavelmente deveriam estar somadas."});
  }
  return a;
}

/* ==================================================================
   Importação
   ================================================================== */
function importar(texto, opts){
  opts = opts || {};
  const cfg = opts.cfg || C();
  const est = opts.estado || S();
  const m = opts.alvo || $("#import-msg");
  const t = (texto || "").trim();
  if(!t){ m.innerHTML = '<div class="msg err">Cole os dados da aba antes de processar.</div>'; return; }
  const rows = parseTable(t);
  if(ehEnvio(rows, cfg)){
    const p = parseEnvio(rows, cfg);
    if(!p.itens.length){ m.innerHTML = '<div class="msg err">Não encontrei linhas de produto nesta aba.</div>'; return; }
    const destino = (opts.destino || (opts.origem ? "" : $("#m-destino").value) || "").trim() ||
                    bonito(cfg.DESTINOS[0]);
    const hj = new Date();
    const data = (opts.data || (opts.origem ? "" : $("#m-data").value) || "").trim() ||
                 (p.meta.dataDecl ? completarAno(p.meta.dataDecl) : null) ||
                 (pad2(hj.getDate()) + "/" + pad2(hj.getMonth()+1) + "/" + hj.getFullYear());
    const id = slug(destino) + "-" + slug(data) + "-" + Date.now().toString(36);
    est.envios = est.envios.filter(e => !(slug(e.destino) === slug(destino) && fmt(e.data) === fmt(data)));
    est.envios.push({id, destino, data, totalDecl: p.totalDecl, naoLidas: p.naoLidas,
                     itens: p.itens, origem: opts.origem || "colado", meta: p.meta});
    est.sel = id; salvarEstado(opts.canal || canal, est);
    const gs = lotes(p.itens, cfg), un = p.itens.reduce((s,i)=>s+i.qtd,0), perdidas = (p.naoLidas||[]).length;
    if(!opts.origem){
      renderTudo();
      m.innerHTML = '<div class="msg ' + (perdidas ? 'err' : 'ok') + '">' + p.itens.length + ' linhas · ' +
        un + ' unidades · ' + gs.length + ' arquivo(s) para ' + esc(destino) + ' ' + fmt(data) + '.' +
        (perdidas ? ' ATENÇÃO: ' + perdidas + ' linha(s) não lida(s).' : '') + '</div>';
      $("#paste").value = "";
    }
    return {tipo:"envio", id};
  }
  if(ehCrono(rows)){
    const c = parseCrono(rows);
    if(!c.length) return {tipo:"crono", datas:0};
    est.crono = c; salvarEstado(opts.canal || canal, est);
    if(!opts.origem){ renderTudo(); m.innerHTML = '<div class="msg ok">Cronograma atualizado: ' + c.length + ' datas.</div>'; $("#paste").value = ""; }
    return {tipo:"crono", datas:c.length};
  }
  m.innerHTML = '<div class="msg err">Não reconheci o conteúdo desta aba.</div>';
  return {tipo:"desconhecido"};
}

/* ==================================================================
   Varredura
   ================================================================== */
let scanAtual = 0;
const vivo = meu => meu === scanAtual;

function candidatos(janela){
  const out = [], hoje = hoje0();
  for(let k = -janela.antes; k <= janela.depois; k++){
    const d = new Date(hoje.getTime() + k*86400000);
    const dd = pad2(d.getDate()), mm = pad2(d.getMonth()+1);
    const data = dd + "/" + mm + "/" + d.getFullYear();
    C().DESTINOS.forEach(dest => out.push({data, passado: k < 0, abas: variantes(dd, mm, dest)}));
  }
  return out;
}
function podar(vistos, est, c){
  est = est || S(); c = c || canal;
  const antes = est.envios.length;
  est.envios = est.envios.filter(e => !e.origem || e.origem === "colado" || vistos.indexOf(e.origem) !== -1);
  if(est.envios.length !== antes){
    if(!est.envios.some(e => e.id === est.sel)) est.sel = null;
    salvarEstado(c, est);
  }
}
function ehMiss(miss, nome, passado){
  const t = miss[nome];
  if(!t) return false;
  return passado || (Date.now() - t) < COMUM.TTL_MISS;
}

async function varrer(forcar, funda){
  const meu = ++scanAtual;
  const meuCanal = canal, cfg = cfgDe(meuCanal), est = estDe(meuCanal);
  const st = $("#status"), box = $("#varredura"), prog = $("#progresso");
  if(!cfg.SHEET_ID){
    st.textContent = "canal sem planilha";
    box.innerHTML = '<div class="msg err"><b>Este canal ainda não tem planilha ligada.</b> ' +
      'Suba a planilha modelo ao Drive, deixe como "qualquer pessoa com o link — leitor" e ' +
      'preencha <span class="mono">SHEET_ID</span> do canal <span class="mono">' + canal +
      '</span> no topo do arquivo. A entrada manual, no fim da página, já funciona.</div>';
    return;
  }
  const miss = forcar ? {} : lerMiss(meuCanal);
  const lista = candidatos(funda ? COMUM.JANELA_FUNDA : COMUM.JANELA);
  const total = lista.length;
  box.innerHTML = '<p class="empty">Procurando envios na planilha…</p>';
  prog.hidden = false; prog.firstElementChild.style.width = "0%";

  try{ await calibrar(cfg, est); }
  catch(e){
    if(!vivo(meu)) return;
    prog.hidden = true;
    st.textContent = "planilha inacessível";
    box.innerHTML = '<div class="msg err"><b>Não consegui ler a planilha.</b> (' + esc(e.message) + ')<br>' +
      'Ela precisa estar como <b>qualquer pessoa com o link — leitor</b>. A entrada manual funciona sem isso.</div>';
    return;
  }

  const vistos = []; let achados = 0, feitos = 0, erro = null;
  const fila = lista.slice();
  async function trabalhador(){
    while(fila.length){
      if(!vivo(meu)) return;
      const c = fila.shift();
      for(const nome of c.abas){
        if(ehMiss(miss, nome, c.passado)) continue;
        try{
          const txt = await baixarAba(nome, cfg, est);
          const n = lerNomeAba(nome) || {};
          const r = importar(txt, {destino: n.destino, data: n.data || c.data, origem: nome,
                                   cfg, estado: est, canal: meuCanal,
                                   alvo: document.createElement("div")});
          if(r && r.tipo === "envio"){ achados++; vistos.push(nome); break; }
        }catch(e){
          if(e.message === "aba inexistente") miss[nome] = Date.now();
          else erro = e.message;
        }
      }
      feitos++;
      if(feitos % 3 === 0 && vivo(meu)){
        const pc = Math.round(feitos/total*100);
        prog.firstElementChild.style.width = pc + "%";
        st.textContent = "procurando… " + pc + "% · " + achados + " encontrado(s)";
      }
    }
  }
  await Promise.all(Array.from({length: COMUM.PARALELO}, trabalhador));
  if(!vivo(meu)) return;

  gravarMiss(miss, meuCanal); podar(vistos, est, meuCanal); est.varrido = true;
  prog.firstElementChild.style.width = "100%";
  setTimeout(() => { if(vivo(meu)) prog.hidden = true; }, 600);
  renderTudo();
  st.textContent = achados + " envio(s) · " + fmt(lista[0].data) + " a " + fmt(lista[total-1].data);
  box.innerHTML = resumo(achados, erro, est.fallbackEhEnvio
    ? '<strong>A primeira aba da planilha é uma aba de envio.</strong> Com o ' +
      '<span class="mono">CRONOGRAMA</span> na primeira posição a leitura fica segura — o Google ' +
      'devolve a primeira aba no lugar de qualquer nome que não exista.' : null);
  carregarCrono(meuCanal);
}

async function carregarCrono(meuCanal){
  meuCanal = meuCanal || canal;
  const cfg = cfgDe(meuCanal), est = estDe(meuCanal);
  /* o CRONOGRAMA é a primeira aba, e primeira aba é o que volta para nome
     inexistente — então é lido sem o guarda de assinatura. */
  try{
    const txt = await textoAba(cfg.ABA_CRONOGRAMA, cfg);
    const r = importar(txt, {origem: cfg.ABA_CRONOGRAMA, cfg, estado: est, canal: meuCanal,
                             alvo: document.createElement("div")});
    if(r && r.tipo === "crono" && meuCanal === canal) renderCrono();
  }catch(e){}
}

async function carregarData(){
  const msg = $("#sheets-msg"), btn = $("#btn-data");
  const meuCanal = canal, cfg = cfgDe(meuCanal), est = estDe(meuCanal);
  const destino = ($("#sh-destino").value || "").trim() || C().DESTINOS[0];
  const dataStr = ($("#sh-data").value || "").trim();
  const d = dObj(dataStr);
  if(!d){ msg.innerHTML = '<div class="msg err">Data inválida. Use dd/mm/aaaa.</div>'; return; }
  const nomes = variantes(pad2(d.getDate()), pad2(d.getMonth()+1), destino);
  btn.disabled = true;
  msg.innerHTML = '<div class="msg ok">Procurando a aba de ' + esc(fmt(dataStr)) + '…</div>';
  let ok = false;
  for(const aba of nomes){
    try{
      const txt = await baixarAba(aba, cfg, est);
      const n = lerNomeAba(aba) || {};
      const r = importar(txt, {destino: n.destino || destino, data: n.data || dataStr, origem: aba,
                               cfg, estado: est, canal: meuCanal, alvo: document.createElement("div")});
      if(r && r.tipo === "envio"){ if(meuCanal === canal) renderTudo(); msg.innerHTML = '<div class="msg ok">Aba "' + esc(aba) + '" carregada.</div>'; ok = true; break; }
    }catch(e){}
  }
  if(!ok) msg.innerHTML = '<div class="msg err">Não achei aba de envio para ' + esc(fmt(dataStr)) +
    ' com os nomes <span class="mono">' + nomes.map(esc).join(" · ") + '</span>.</div>';
  btn.disabled = false;
}

/* ==================================================================
   Render
   ================================================================== */
function kpi(v,k,hero){ return '<div class="kpi' + (hero ? ' hero' : '') + '"><div class="v">' + v + '</div><div class="k">' + k + '</div></div>'; }

function resumo(achados, erro, nota){
  const daPlanilha = S().envios.filter(e => e.origem && e.origem !== "colado");
  let h = "";
  if(erro) h += '<div class="msg err">Algumas leituras falharam: ' + esc(erro) + '</div>';
  if(nota) h += '<p class="empty">' + nota + '</p>';
  if(!daPlanilha.length) return h + (nota ? "" :
    '<p class="empty">Nenhum envio encontrado nesta faixa de datas. Tente <b>Buscar mais fundo</b>, ' +
    'a carga por data específica, ou a entrada manual.</p>');
  h += '<div class="envios-grid">' + daPlanilha
    .sort((a,b) => (dObj(a.data)||0) - (dObj(b.data)||0))
    .map((e,idx) => {
      const gs = lotes(e.itens), un = e.itens.reduce((s,i)=>s+i.qtd,0);
      const alertas = auditar(e).filter(a => a.k === "c").length;
      const d = dObj(e.data), t = hoje0();
      const dias = d ? Math.round((d - t)/86400000) : null;
      const quando = dias === 0 ? "hoje" : dias === 1 ? "amanhã" : dias === -1 ? "ontem"
        : dias > 0 ? "em " + dias + "d" : Math.abs(dias) + "d atrás";
      return '<div class="env ' + (alertas ? "alerta" : "pronto") + '" style="animation-delay:' + (idx*55) + 'ms">' +
        '<div><div class="topo2"><span class="data">' + fmt(e.data) + '</span>' +
          '<span class="dest">' + esc(e.destino) + '</span>' +
          '<span class="pill a">' + quando + '</span></div>' +
          '<div class="num" style="margin-top:6px">' +
            (e.meta && e.meta.envioNum ? 'envio #' + esc(e.meta.envioNum) + ' · ' : '') +
            esc(e.origem) + ' · emissão ' + emissao(e.data) + '</div></div>' +
        '<div class="metricas">' +
          '<div><b>' + un.toLocaleString("pt-BR") + '</b><span>unidades</span></div>' +
          '<div><b>' + e.itens.length + '</b><span>linhas</span></div>' +
          '<div><b>' + gs.length + '</b><span>' + (gs.length>1?"arquivos":"arquivo") + '</span></div>' +
        '</div>' +
        (alertas ? '<span class="pill c">' + alertas + ' ponto' + (alertas>1?'s':'') + ' a corrigir</span>'
                 : '<span class="pill g">total confere com a planilha</span>') +
        '<div class="acoes">' +
          '<button class="btn primary sm baixar" data-env="' + e.id + '">Baixar ' +
            (gs.length>1 ? gs.length + ' arquivos' : 'arquivo') + '</button>' +
          '<button class="btn sm ver" data-env="' + e.id + '">Detalhe</button></div></div>';
    }).join("") + '</div>';
  return h;
}

function renderChips(){
  const el = $("#chips"), det = $("#detalhe");
  if(!S().envios.length){ el.innerHTML = ""; det.innerHTML = '<p class="empty">Nenhum envio carregado.</p>'; return; }
  if(!S().envios.some(e => e.id === S().sel)) S().sel = S().envios[S().envios.length-1].id;
  el.innerHTML = S().envios.map(e =>
    '<span class="chip" role="button" tabindex="0" aria-selected="' + (e.id === S().sel) + '" data-id="' + e.id + '">' +
    esc(e.destino) + " " + fmt(e.data) +
    '<span class="pill n">' + e.itens.reduce((s,i)=>s+i.qtd,0) + ' un</span></span>').join("");
  el.querySelectorAll(".chip").forEach(c => {
    const sel = () => { S().sel = c.dataset.id; salvar(); renderChips(); };
    c.addEventListener("click", sel);
    c.addEventListener("keydown", ev => { if(ev.key === "Enter") sel(); });
  });
  det.innerHTML = detalhe(S().envios.find(e => e.id === S().sel));
  ligarDetalhe();
}

function detalhe(env){
  if(!env) return "";
  const gs = lotes(env.itens), un = env.itens.reduce((s,i)=>s+i.qtd,0), cap = COMUM.MAX_UNIDADES_LOTE;
  const top = [...env.itens].sort((a,b)=>b.qtd-a.qtd).slice(0,5);
  let h = '<div class="kpis">' +
    kpi(un.toLocaleString("pt-BR"), "unidades", true) +
    kpi(env.itens.length, "linhas") +
    kpi(gs.length, gs.length === 1 ? "arquivo" : "arquivos") +
    kpi(emissao(env.data), "emissão (D-1)") +
    (env.meta && env.meta.envioNum ? kpi("#" + env.meta.envioNum, "nº do envio") : "") +
    '</div>';

  const aud = auditar(env);
  if(aud.length){
    const graves = aud.filter(a => a.k === "c").length;
    h += '<div style="margin-top:16px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden">' +
      '<div style="padding:11px 14px;border-bottom:1px solid var(--line);background:' +
      (graves ? 'var(--crit-soft)' : 'var(--warn-soft)') + '"><strong style="font-size:13.5px;color:' +
      (graves ? 'var(--crit)' : 'var(--warn)') + '">Conferência — ' + aud.length + ' ponto' +
      (aud.length>1?'s':'') + (graves ? ' · ' + graves + ' bloqueante' + (graves>1?'s':'') : '') + '</strong></div>' +
      aud.map(a => '<div style="padding:10px 14px;border-bottom:1px solid var(--line)">' +
        '<span class="pill ' + a.k + '">' + (a.k === "c" ? "corrigir" : "verificar") + '</span> ' +
        '<strong style="font-size:13px">' + esc(a.t) + '</strong>' +
        '<div class="mono" style="font-size:12.5px;color:var(--ink-2);margin-top:3px">' + esc(a.d) + '</div></div>').join("") +
      '</div>';
  }

  h += '<h3 style="margin:22px 0 10px;font-size:15px">Arquivos de separação</h3>' +
    '<p class="empty" style="padding:0 0 12px">' + (gs.length === 1
      ? 'Um arquivo atende o envio — o total cabe no teto de ' + cap + ' unidades.'
      : gs.length + ' arquivos de até ' + cap + ' unidades, equilibrados para separação simultânea' +
        (C().regraSKU ? ', com no máximo uma linha por SKU' : '') + '.') + '</p>' +
    '<div class="lotes">' + gs.map((g,i) => {
      const u = unLote(g), estouro = u > cap;
      return '<div class="lote" style="animation-delay:' + (i*45) + 'ms"><div class="n">Arquivo ' + (i+1) + '</div>' +
        '<div class="m">' + g.length + ' linha' + (g.length>1?'s':'') + ' · ' + u.toLocaleString("pt-BR") + ' un</div>' +
        (estouro ? '<span class="pill w">acima de ' + cap + ' un — linha única de ' +
          Math.max(...g.map(x=>x.qtd)).toLocaleString("pt-BR") + '</span>' : '') +
        '<div class="fn">' + nomeArq(env, i, gs.length) + '.csv</div>' +
        '<button class="btn sm dl" data-lote="' + i + '">Baixar ISO-8859-1</button></div>';
    }).join("") + '</div>' +
    (gs.length > 1 ? '<div style="margin-top:12px"><button class="btn primary sm" id="dl-todos">Baixar os ' + gs.length + ' arquivos</button></div>' : '') +
    '<div id="dl-msg"></div>';

  h += '<h3 style="margin:22px 0 10px;font-size:15px">Itens do envio</h3><div class="scroll"><table><thead><tr>' +
    '<th>Arq.</th><th>SKU</th><th class="num">Un</th>' + (C().regraSKU ? '<th>Código ML</th>' : '') +
    '<th>Produto</th><th></th></tr></thead><tbody>' +
    gs.flatMap((g,i) => g.map(it =>
      '<tr><td>' + (i+1) + '</td><td class="mono">' + esc(it.sku) + '</td><td class="num">' + it.qtd + '</td>' +
      (C().regraSKU ? '<td class="mono">' + esc(it.ml) + '</td>' : '') +
      '<td>' + esc(it.desc) + '</td><td>' +
      it.flags.map(f => '<span class="pill ' + f.k + '">' + f.t + '</span>').join(" ") + '</td></tr>')).join("") +
    '</tbody></table></div>';
  return h;
}

function ligarDetalhe(){
  const env = S().envios.find(e => e.id === S().sel);
  if(!env) return;
  const gs = lotes(env.itens), msg = $("#dl-msg");
  document.querySelectorAll(".dl").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.lote; baixar(nomeArq(env, i, gs.length), csvLote(gs[i]), msg);
  }));
  const todos = $("#dl-todos");
  if(todos) todos.addEventListener("click", () => {
    todos.disabled = true;
    gs.forEach((g,i) => setTimeout(() => baixar(nomeArq(env, i, gs.length), csvLote(g), msg), i*350));
    setTimeout(() => todos.disabled = false, gs.length*350 + 200);
  });
}

function renderCrono(){
  const el = $("#crono");
  if(!S().crono.length){ el.innerHTML = '<p class="empty">Nenhum cronograma na planilha deste canal.</p>'; return; }
  const t = hoje0(), ver = $("#ck-passados").checked;
  const lista = S().crono.map(c => ({...c, _d: dObj(c.data)}))
    .filter(c => c._d && (ver || c._d >= t)).sort((a,b) => a._d - b._d);
  if(!lista.length){ el.innerHTML = '<p class="empty">Sem envios futuros no cronograma.</p>'; return; }
  el.innerHTML = '<div class="cronoline">' + lista.map(c => {
    const dias = Math.round((c._d - t)/86400000);
    const quando = dias === 0 ? '<span class="pill a">hoje</span>' : dias === 1 ? '<span class="pill a">amanhã</span>'
      : dias < 0 ? '<span class="pill n">' + Math.abs(dias) + 'd atrás</span>' : '<span class="pill n">em ' + dias + 'd</span>';
    const pronto = S().envios.some(e => dObj(e.data) && c._d && dObj(e.data).getTime() === c._d.getTime());
    return '<div class="crow' + (dias === 0 ? ' hoje' : '') + '">' +
      '<div class="d">' + fmt(c.data) + '<small>' + diaSem(c.data) + '</small></div>' +
      '<div><strong>' + esc(c.destino) + '</strong><div class="sub">' + esc(c.modo || "—") +
      (c.motorista ? " · " + esc(c.motorista) : "") + '</div></div>' +
      '<div style="display:flex;gap:6px;align-items:center">' +
      (pronto ? '<span class="pill g">lista pronta</span>' : '') + quando + '</div></div>';
  }).join("") + '</div>';
}

function renderChart(){
  const el = $("#chart");
  const dados = S().envios.map(e => ({...e, un: e.itens.reduce((s,i)=>s+i.qtd,0), _d: dObj(e.data)}))
    .sort((a,b) => (a._d||0) - (b._d||0));
  if(!dados.length){ el.innerHTML = '<p class="empty">Importe um envio para ver o volume.</p>'; $("#vol-sub").textContent = ""; return; }
  const total = dados.reduce((s,d)=>s+d.un,0);
  $("#vol-sub").textContent = dados.length + " envio(s) · " + total.toLocaleString("pt-BR") + " un";
  const W = 100, H = 190, pad = {t:14, r:8, b:34, l:40};
  const max = Math.max(...dados.map(d=>d.un)) || 1, step = 1/dados.length;
  const bw = Math.min(step*0.58, 0.075), ticks = [0, max/2, max];
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="width:100%;height:' + H + 'px;overflow:visible" role="img" aria-label="Unidades por envio">';
  ticks.forEach(v => {
    const y = pad.t + (H-pad.t-pad.b)*(1 - v/max);
    svg += '<line class="grid" x1="' + pad.l/W*100 + '" x2="100" y1="' + y + '" y2="' + y + '" stroke-width=".5" vector-effect="non-scaling-stroke"/>';
  });
  dados.forEach((d,i) => {
    const cx = (pad.l/W*100) + (100 - pad.l/W*100)*(step*i + step/2);
    const h = (H-pad.t-pad.b)*(d.un/max);
    svg += '<rect class="bar' + (d.id === S().sel ? ' sel' : '') + '" x="' + (cx - bw*100/2) + '" y="' + (H-pad.b-h) +
      '" width="' + bw*100 + '" height="' + Math.max(h,0.6) + '" rx="1.2" data-i="' + i + '"/>';
  });
  svg += '</svg>';
  const eixo = ticks.map(v => {
    const y = pad.t + (H-pad.t-pad.b)*(1 - v/max);
    return '<div style="position:absolute;right:calc(100% - ' + (pad.l/W*100) + '%);top:' + (y/H*100) +
      '%;transform:translate(-6px,-50%);font-family:\'IBM Plex Mono\',monospace;font-size:10.5px;color:var(--ink-3)">' +
      Math.round(v).toLocaleString("pt-BR") + '</div>';
  }).join("");
  const rot = dados.length > 6;
  const labels = dados.map((d,i) => {
    const cx = (pad.l/W*100) + (100 - pad.l/W*100)*(step*i + step/2);
    return '<div style="position:absolute;left:' + cx + '%;bottom:0;transform:translateX(-50%)' +
      (rot ? ' rotate(-35deg);transform-origin:top center' : '') + ';font-size:11px;color:var(--ink-2);white-space:nowrap;text-align:center">' +
      fmt(d.data) + '<div style="font-size:10px;color:var(--ink-3)">' + esc(d.destino) + '</div></div>';
  }).join("");
  el.innerHTML = '<div style="position:relative;padding-bottom:' + (rot?46:34) + 'px">' + svg + eixo + labels + '</div>';
  const tip = $("#tip");
  el.querySelectorAll(".bar").forEach(b => {
    b.addEventListener("mousemove", ev => {
      const d = dados[+b.dataset.i];
      tip.innerHTML = esc(d.destino) + " " + fmt(d.data) + " — " + d.un.toLocaleString("pt-BR") + " un · " + d.itens.length + " linhas";
      tip.style.opacity = 1; tip.style.left = (ev.clientX+12) + "px"; tip.style.top = (ev.clientY-34) + "px";
    });
    b.addEventListener("mouseleave", () => tip.style.opacity = 0);
    b.addEventListener("click", () => { S().sel = dados[+b.dataset.i].id; salvar(); renderChips(); renderChart(); });
  });
}

let relDias = 30;
function renderRel(){
  document.querySelectorAll("#seg .btn").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.dias === relDias)));
  const el = $("#relatorio"), t = hoje0();
  const ini = relDias > 0 ? new Date(t.getTime() - (relDias-1)*86400000) : null;
  const envios = S().envios.filter(e => { const d = dObj(e.data); return d && (!ini || d >= ini) && d <= t; })
                           .sort((a,b) => (dObj(b.data)||0) - (dObj(a.data)||0));
  const rotulo = relDias ? "últimos " + relDias + " dias" : "período completo";
  if(!envios.length){ el.innerHTML = '<p class="empty">Nenhum envio no ' + rotulo + '. Envios futuros não entram — o relatório fecha em hoje.</p>'; return; }
  const un = envios.reduce((s,e)=>s+e.itens.reduce((x,i)=>x+i.qtd,0),0);
  const linhas = envios.reduce((s,e)=>s+e.itens.length,0);
  const arqs = envios.reduce((s,e)=>s+lotes(e.itens).length,0);
  const dias = new Set(envios.map(e => fmt(e.data))).size;
  const porDest = {}, porSku = {};
  envios.forEach(e => {
    const k = e.destino || "—";
    (porDest[k] = porDest[k] || {envios:0, un:0, linhas:0});
    porDest[k].envios++; porDest[k].un += e.itens.reduce((x,i)=>x+i.qtd,0); porDest[k].linhas += e.itens.length;
    e.itens.forEach(i => {
      (porSku[i.sku] = porSku[i.sku] || {un:0, envios:new Set(), desc:i.desc});
      porSku[i.sku].un += i.qtd; porSku[i.sku].envios.add(e.id);
    });
  });
  const topSku = Object.keys(porSku).map(k => ({sku:k, ...porSku[k]})).sort((a,b)=>b.un-a.un).slice(0,12);
  let h = '<div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:16px">' +
    '<span class="eyebrow">' + rotulo + ' · ' + fmt(envios[envios.length-1].data) + ' a ' + fmt(envios[0].data) + '</span>' +
    '<button class="btn sm" id="btn-rel">Baixar relatório (.csv)</button></div>';
  h += '<div class="kpis">' + kpi(un.toLocaleString("pt-BR"), "unidades", true) +
    kpi(envios.length, envios.length===1?"envio":"envios") + kpi(dias, dias===1?"dia com envio":"dias com envio") +
    kpi(linhas, "linhas") + kpi(arqs, "arquivos") + kpi(Math.round(un/dias).toLocaleString("pt-BR"), "un / dia") + '</div>';
  h += '<div class="rel-cols"><div><h3 style="font-size:15px;margin-bottom:10px">Por destino</h3><div class="scroll"><table>' +
    '<thead><tr><th>Destino</th><th class="num">Envios</th><th class="num">Unidades</th></tr></thead><tbody>' +
    Object.keys(porDest).sort((a,b)=>porDest[b].un-porDest[a].un).map(k =>
      '<tr><td>' + esc(k) + '</td><td class="num">' + porDest[k].envios + '</td><td class="num">' +
      porDest[k].un.toLocaleString("pt-BR") + '</td></tr>').join("") + '</tbody></table></div>' +
    '<h3 style="font-size:15px;margin:20px 0 10px">Envios</h3><div class="scroll"><table>' +
    '<thead><tr><th>Data</th><th>Destino</th><th class="num">Un</th><th class="num">Arq.</th></tr></thead><tbody>' +
    envios.map(e => '<tr><td class="mono">' + fmt(e.data) + '</td><td>' + esc(e.destino) + '</td><td class="num">' +
      e.itens.reduce((x,i)=>x+i.qtd,0).toLocaleString("pt-BR") + '</td><td class="num">' + lotes(e.itens).length +
      '</td></tr>').join("") + '</tbody></table></div></div><div>' +
    '<h3 style="font-size:15px;margin-bottom:10px">SKUs de maior volume</h3><div class="scroll"><table>' +
    '<thead><tr><th>SKU</th><th class="num">Un</th><th class="num">Envios</th><th>Produto</th></tr></thead><tbody>' +
    topSku.map(x => '<tr><td class="mono">' + esc(x.sku) + '</td><td class="num">' + x.un.toLocaleString("pt-BR") +
      '</td><td class="num">' + x.envios.size + '</td><td>' + esc((x.desc||"").slice(0,44)) + '</td></tr>').join("") +
    '</tbody></table></div></div></div>';
  el.innerHTML = h;
  $("#btn-rel").addEventListener("click", () => {
    let csv = "RELATORIO " + C().nome.toUpperCase() + ";" + rotulo + "\n";
    csv += "data;destino;aba;numero do envio;linhas;unidades;arquivos\n";
    envios.forEach(e => csv += [fmt(e.data), e.destino, e.origem || "manual", (e.meta && e.meta.envioNum) || "",
      e.itens.length, e.itens.reduce((x,i)=>x+i.qtd,0), lotes(e.itens).length].join(";") + "\n");
    csv += "\nTOTAL;;;;" + linhas + ";" + un + ";" + arqs + "\n\nsku;unidades;envios;produto\n";
    Object.keys(porSku).sort((a,b)=>porSku[b].un-porSku[a].un).forEach(k =>
      csv += [k, porSku[k].un, porSku[k].envios.size, (porSku[k].desc||"").replace(/;/g,",")].join(";") + "\n");
    baixar("RELATORIO_" + slug(C().nome) + "_" + (relDias || "TUDO") + "D", csv, el);
  });
}

function animaNumero(el, alvo){
  const ini = 0, t0 = performance.now(), dur = 700;
  const reduz = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduz || alvo > 99999){ el.textContent = alvo.toLocaleString("pt-BR"); return; }
  function passo(t){
    const p = Math.min(1, (t - t0)/dur), e = 1 - Math.pow(1-p, 3);
    el.textContent = Math.round(ini + (alvo-ini)*e).toLocaleString("pt-BR");
    if(p < 1) requestAnimationFrame(passo);
  }
  requestAnimationFrame(passo);
}
function renderBanda(){
  const un = S().envios.reduce((s,e) => s + e.itens.reduce((x,i)=>x+i.qtd,0), 0);
  const arqs = S().envios.reduce((s,e) => s + lotes(e.itens).length, 0);
  const pend = S().envios.reduce((s,e) => s + auditar(e).filter(a=>a.k==="c").length, 0);
  const campos = [[S().envios.length, "envios"], [un, "unidades"], [arqs, "arquivos"]];
  if(pend) campos.push([pend, "a corrigir"]);
  $("#stats").innerHTML = campos.map(([v,k]) =>
    '<div class="s"><div class="sv" data-v="' + v + '">0</div><div class="sk">' + k + '</div></div>').join("");
  $("#stats").querySelectorAll(".sv").forEach(el => animaNumero(el, +el.dataset.v));
  Object.keys(CANAIS).forEach(c => {
    const n = ESTADOS[c].envios.length;
    $("#cont-" + c).textContent = n ? n : "";
  });
}
function renderTudo(){ renderCrono(); renderChart(); renderChips(); renderBanda(); renderRel(); }

/* ==================================================================
   Troca de canal
   ================================================================== */
function moverIndicador(){
  const ativa = document.querySelector('.aba[aria-selected="true"]');
  const ind = $("#indicador");
  ind.style.width = ativa.offsetWidth + "px";
  ind.style.transform = "translateX(" + ativa.offsetLeft + "px)";
}
function trocarCanal(novo, semScan){
  if(!CANAIS[novo]) return;
  const mudou = novo !== canal;
  canal = novo;
  const cfg = C();
  document.documentElement.style.setProperty("--canal", cfg.cor);
  /* o chip de contexto (hoje/amanhã) acompanha a cor do canal */
  const rgb = cfg.cor.replace("#","").match(/.{2}/g).map(h => parseInt(h,16)).join(",");
  document.documentElement.style.setProperty("--chip-bg", "rgba(" + rgb + ",.22)");
  document.documentElement.style.setProperty("--chip-ink",
    canal === "full" ? "#212121" : cfg.cor);
  document.querySelectorAll(".aba").forEach(a => a.setAttribute("aria-selected", String(a.dataset.canal === novo)));
  $("#eyebrow").textContent = cfg.eyebrow;
  $("#subtitulo").textContent = cfg.sub;
  $("#titulo").textContent = "Separador " + (novo === "full" ? "Full" : "Shopee");
  $("#foot-fmt").textContent = "Arquivos: " + cfg.colunas.join(";") + " · ISO-8859-1 · sem BOM · até " +
    COMUM.MAX_UNIDADES_LOTE + " un por arquivo";
  $("#sh-destino").placeholder = cfg.DESTINOS[0];
  $("#m-destino").placeholder = cfg.DESTINOS[0];
  location.hash = novo;
  if(mudou){
    $("#band").classList.add("trocando");
    setTimeout(() => $("#band").classList.remove("trocando"), 700);
  }
  moverIndicador();
  renderTudo();
  if(!semScan && !S().varrido) varrer(false);
  else if(S().varrido) $("#status").textContent = S().envios.filter(e=>e.origem!=="colado").length + " envio(s) carregado(s)";
}
function trocaComTransicao(novo){
  if(novo === canal) return;
  const w = $("#wrap");
  w.classList.add("saindo");
  setTimeout(() => { trocarCanal(novo); w.classList.remove("saindo"); }, 180);
}

/* ==================================================================
   Eventos
   ================================================================== */
$("#abas").addEventListener("keydown", ev => {
  if(ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
  const nomes = Object.keys(CANAIS), i = nomes.indexOf(canal);
  const alvo = nomes[(i + (ev.key === "ArrowRight" ? 1 : nomes.length-1)) % nomes.length];
  trocaComTransicao(alvo);
  const b = document.querySelector('.aba[data-canal="' + alvo + '"]');
  if(b) b.focus();
  ev.preventDefault();
});
$("#abas").addEventListener("click", ev => {
  const b = ev.target.closest(".aba");
  if(b) trocaComTransicao(b.dataset.canal);
});
$("#btn-varrer").addEventListener("click", () => varrer(true));
$("#btn-fundo").addEventListener("click", () => varrer(true, true));
$("#btn-zerar").addEventListener("click", () => {
  S().envios = []; S().crono = []; S().sel = null;
  try{ localStorage.removeItem(chaveMiss(canal)); }catch(e){}
  salvar(); renderTudo(); varrer(true);
});
$("#btn-data").addEventListener("click", carregarData);
$("#btn-import").addEventListener("click", () => importar($("#paste").value));
$("#ck-passados").addEventListener("change", renderCrono);
$("#seg").addEventListener("click", ev => {
  const b = ev.target.closest("button[data-dias]");
  if(b){ relDias = +b.dataset.dias; renderRel(); }
});
$("#btn-backup").addEventListener("click", () =>
  baixar("backup_" + canal, JSON.stringify({canal, estado: S()}, null, 2), $("#import-msg"), ".json"));
$("#btn-tema").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const escuro = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", escuro ? "light" : "dark");
});
document.addEventListener("click", ev => {
  const bx = ev.target.closest(".baixar"), vr = ev.target.closest(".ver");
  if(vr){ S().sel = vr.dataset.env; salvar(); renderChips(); $("#detalhe").scrollIntoView({behavior:"smooth", block:"start"}); return; }
  if(!bx) return;
  const env = S().envios.find(e => e.id === bx.dataset.env);
  if(!env) return;
  const gs = lotes(env.itens);
  bx.disabled = true;
  gs.forEach((g,i) => setTimeout(() => baixar(nomeArq(env, i, gs.length), csvLote(g), $("#varredura")), i*350));
  setTimeout(() => bx.disabled = false, gs.length*350 + 200);
});
const drop = $("#drop");
["dragenter","dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", ev => {
  const f = ev.dataTransfer.files && ev.dataTransfer.files[0];
  if(!f) return;
  const ler = (enc, cb) => { const r = new FileReader(); r.onload = () => cb(String(r.result)); r.readAsText(f, enc); };
  ler("utf-8", txt => {
    if(txt.indexOf("�") !== -1) ler("iso-8859-1", t2 => { $("#paste").value = t2; importar(t2); });
    else { $("#paste").value = txt; importar(txt); }
  });
});
addEventListener("resize", moverIndicador);
addEventListener("hashchange", () => {
  const h = location.hash.replace("#","");
  if(CANAIS[h] && h !== canal) trocaComTransicao(h);
});

/* ---------- boot ---------- */
carregar();
const inicial = CANAIS[location.hash.replace("#","")] ? location.hash.replace("#","") : "full";
trocarCanal(inicial, true);
requestAnimationFrame(moverIndicador);
setTimeout(() => { if(!S().varrido) varrer(false); }, 60);
</script>
